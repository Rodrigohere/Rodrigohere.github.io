<body>
<header>
  <div>
    <h1>CRU<span class="dot">.</span></h1>
    <div class="sub" id="sub">tradutor sem filtro</div>
  </div>
  <div style="display:flex;align-items:center;gap:6px;">
    <select id="lang"></select>
    <button class="troca" id="troca">✍️ escrever</button>
  </div>
</header>

<main>
<section id="view-traduzir">
  <div class="box">
    <textarea id="input" rows="3" placeholder="Escreve do teu jeito. Palavrão, gíria, ironia, tudo passa."></textarea>
    <div class="bar">
      <div class="modes" id="modes">
        <button data-m="auto" class="on">auto</button>
        <button data-m="frase">frase</button>
        <button data-m="palavra">palavra</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="limpa hidden" id="limpa">✕ limpar</button>
        <button class="go" id="go" disabled>Traduzir</button>
      </div>
    </div>
  </div>
  <div class="hint hidden" id="hint"></div>
  <div class="err hidden" id="err"></div>
  <div class="loading hidden" id="loading"><span class="pulse"></span> traduzindo sem passar pano...</div>
  <div class="res hidden" id="res"></div>
  <div class="hist hidden" id="hist">
    <div class="sub-label grey" style="margin-bottom:6px;">histórico</div>
    <div id="histlist"></div>
  </div>
</section>

<section id="view-escrever" class="hidden">
  <div class="box">
    <textarea id="fala" rows="4" placeholder="Toca aqui, aperta o 🎤 do teclado do teu iPhone e fala à vontade. Depois é só ORGANIZAR."></textarea>
    <div class="bar">
      <div class="dita">🎤 dita pelo teclado</div>
      <div class="botoes">
        <button class="limpa hidden" id="limpa2">✕</button>
        <button class="go preta" id="enxuga" disabled>✂️ enxugar</button>
        <button class="go" id="org" disabled>Organizar</button>
      </div>
    </div>
  </div>
  <div class="tons" id="tons">
    <button data-t="formal">formal</button>
    <button data-t="natural" class="on">natural</button>
    <button data-t="solto">solto</button>
  </div>
  <div class="hint" id="dicatom"></div>
  <div class="err hidden" id="err2"></div>
  <div class="loading hidden" id="loading2"><span class="pulse"></span> arrumando o que você falou...</div>
  <div id="res2"></div>
  <div class="hist hidden" id="hist2">
    <div class="sub-label grey" style="margin-bottom:6px;">falas anteriores</div>
    <div id="histlist2"></div>
  </div>
</section>
</main>

<footer id="rodape">cultura não se traduz. intenção atravessa.</footer>


<script>
const LANGS = [
  ["es","Español","🇵🇦"],["en","English","🇺🇸"],["ru","Русский","🇷🇺"],
  ["fr","Français","🇫🇷"],["it","Italiano","🇮🇹"],["de","Deutsch","🇩🇪"],
  ["zh","中文","🇨🇳"],["ja","日本語","🇯🇵"],["ko","한국어","🇰🇷"],
  ["ar","العربية","🇸🇦"],["tr","Türkçe","🇹🇷"],["th","ไทย","🇹🇭"],
  ["vi","Tiếng Việt","🇻🇳"],["id","Indonesia","🇮🇩"],["nl","Nederlands","🇳🇱"],
  ["el","Ελληνικά","🇬🇷"],["hi","हिन्दी","🇮🇳"],["pl","Polski","🇵🇱"]
];
const $ = (id) => document.getElementById(id);

// ── VOZ ────────────────────────────────────────────────────────────────────
// Rodrigo 07/09/2026: "coloca pra escutar como que pronuncia".
// Usa a voz do proprio aparelho (speechSynthesis): sai na hora, funciona sem
// internet e nao custa nada por traducao. No iPhone so toca a partir de um
// toque na tela, e por isso e sempre botao, nunca automatico.
const TAG = {
  es:"es-MX", en:"en-US", ru:"ru-RU", fr:"fr-FR", it:"it-IT", de:"de-DE",
  zh:"zh-CN", ja:"ja-JP", ko:"ko-KR", ar:"ar-SA", tr:"tr-TR", th:"th-TH",
  vi:"vi-VN", id:"id-ID", nl:"nl-NL", el:"el-GR", hi:"hi-IN", pl:"pl-PL"
};
const TEM_VOZ = typeof speechSynthesis !== "undefined" && typeof SpeechSynthesisUtterance !== "undefined";

// A traducao esta na lingua de destino, MENOS quando a direcao termina em "pt"
// (o usuario mandou em outra lingua e recebeu portugues de volta).
function tagDaTraducao(direcao) {
  const d = String(direcao || "");
  if (/→\s*pt$/.test(d)) return "pt-BR";
  const m = d.match(/→\s*([a-z]{2})/);
  return TAG[m && m[1]] || TAG[state.target] || "pt-BR";
}

let _falandoEm = null;
function falar(texto, tag, botao) {
  if (!TEM_VOZ || !texto) return;
  const mesmo = _falandoEm === botao && speechSynthesis.speaking;
  speechSynthesis.cancel();                 // sem isso a fila empilha no iOS
  document.querySelectorAll(".spk.on,.soundbtn.on").forEach(b => b.classList.remove("on"));
  if (mesmo) { _falandoEm = null; return; } // segundo toque = parar
  const u = new SpeechSynthesisUtterance(String(texto));
  u.lang = tag;
  u.rate = 0.92;                            // um tico mais devagar: e pra APRENDER a falar
  const v = speechSynthesis.getVoices().find(x => x.lang === tag)
        || speechSynthesis.getVoices().find(x => x.lang.slice(0,2) === tag.slice(0,2));
  if (v) u.voice = v;
  if (botao) {
    botao.classList.add("on");
    _falandoEm = botao;
    u.onend = u.onerror = () => { botao.classList.remove("on"); _falandoEm = null; };
  }
  speechSynthesis.speak(u);
}
// O iPhone entrega a lista de vozes atrasada; sem isto a primeira fala sai na
// voz errada porque getVoices() ainda estava vazio.
if (TEM_VOZ) speechSynthesis.onvoiceschanged = () => {};
try { localStorage.removeItem("cru_key"); } catch {}
const state = {
  mode: "auto",
  target: localStorage.getItem("cru_lang") || "es",
  hist: JSON.parse(localStorage.getItem("cru_hist") || "[]"),
  result: null, showFormal: false
};

// idiomas
const sel = $("lang");
LANGS.forEach(([c,l,f]) => {
  const o = document.createElement("option");
  o.value = c; o.textContent = `${f} PT ↔ ${l}`;
  sel.appendChild(o);
});
sel.value = state.target;
sel.onchange = () => { state.target = sel.value; localStorage.setItem("cru_lang", sel.value); };

const langName = (c) => (LANGS.find(x => x[0]===c)||[,"?"])[1];

const isWord = (t) => {
  const c = t.trim();
  return c && c.split(/\s+/).length <= 2 && !/[.!?,;:]/.test(c);
};

const limpar = (t) => {
  if (!t || typeof t !== "string") return t;
  let s = t;
  s = s.replace(/[¿¡]/g, "");
  s = s.replace(/\s*[—–]\s*/g, ", ");
  s = s.replace(/\s+-\s+/g, ", ");
  s = s.replace(/_/g, " ");
  s = s.replace(/(\d):(\d)/g, "$1\u0000$2");
  s = s.replace(/\s*:\s*/g, ", ");
  s = s.replace(/\u0000/g, ":");
  s = s.replace(/;/g, ",");
  s = s.replace(/["\u201C\u201D«»]/g, "");
  s = s.replace(/\s{2,}/g, " ").trim();
  s = s.replace(/\.+$/, "");
  s = s.replace(/,\s*,/g, ",");
  return s.trim();
};

function phrasePrompt(input, target) {
  const ln = langName(target);
  return `Você é um tradutor CULTURAL CRU entre português brasileiro e ${ln}.

REGRA CENTRAL: você NUNCA higieniza, suaviza, formaliza ou "adapta culturalmente" o conteúdo. Você traduz a MENSAGEM COM A MESMA ENERGIA. Se o texto é agressivo, a tradução é agressiva no mesmo grau. Se é carinhoso e meloso, sai meloso. Se tem palavrão, sai com palavrão de peso equivalente. Se é irônico, sai irônico. A intenção, a intensidade e o registro atravessam intactos. O ouvinte deve sentir EXATAMENTE o que um brasileiro sentiria ouvindo o original.

O que você adapta é só o veículo linguístico: use a gíria, o palavrão e a construção NATIVA que carrega o mesmo peso e o mesmo tom na língua de destino (para espanhol, priorize o uso latino-americano quando houver diferença). Não traduza literalmente expressões idiomáticas: encontre a equivalente com a mesma força. Nunca troque um insulto por eufemismo, nunca transforme intimidade em formalidade, nunca adicione cortesia que não existia.

DIREÇÃO: detecte o idioma do texto. Se for português, traduza para ${ln}. Se for ${ln} ou outro idioma, traduza para português brasileiro coloquial, mantendo o tom cru original do falante.

FORMATAÇÃO OBRIGATÓRIA DA TRADUÇÃO INFORMAL: sai pronta pra colar no WhatsApp, escrita como nativo escreve no celular de verdade. PROIBIDO TERMINANTEMENTE: travessão e hífen de pontuação, dois pontos, ponto e vírgula, underline, aspas, parênteses, interrogação e exclamação invertidas do espanhol (nativo nenhum usa isso no zap), e ponto final no fim da mensagem. Pontuação permitida: vírgula, e no máximo ? ou ! de fechamento quando a frase realmente pedir. Abreviações naturais da língua são bem-vindas quando o original for informal. A versão "formal" pode usar pontuação completa, a regra dura vale só pra informal.

TEXTO:
"""${input}"""

Responda SOMENTE com JSON válido, sem markdown, sem texto antes ou depois:

let respostaCortada = false;

async function pedir(prompt, rapido) {
  if (navigator.onLine === false) throw new Error("SEMNET");
  const corta = new AbortController();
  const relogio = setTimeout(() => corta.abort(), 90000);
  let res;
  try {
    res = await fetch(CANO, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ prompt, rapido: !!rapido }),
      signal: corta.signal
    });
  } catch (e) {
    throw new Error(e && e.name === "AbortError" ? "DEMOROU" : "SEMNET");
  } finally { clearTimeout(relogio); }
  if (res.status === 429) throw new Error("MUITO");
  if (res.status === 413) throw new Error("GRANDE");
  if (!res.ok) throw new Error("API " + res.status);
  const data = await res.json();
  if (data.erro) throw new Error(data.erro);
  respostaCortada = data.cortou === true;
  return String(data.texto || "").replace(/```json|```/g, "").trim();
}

// Uma mensagem pra cada coisa que pode dar errado, em vez de "deu ruim".
function motivo(e) {
  const m = (e && e.message) || "";
  if (m === "MUITO") return "muita coisa de uma vez. espera um minutinho e manda de novo";
  if (m === "SEMNET") return "sem internet agora. confere a conexão e manda de novo";
  if (m === "DEMOROU") return "demorou demais e eu desisti. manda de novo, ou corta a fala em duas partes";
  if (m === "GRANDE") return "essa fala é grande demais até pra mim. corta em duas partes";
  if (m === "VAZIO") return "voltou vazio. manda de novo";
  return "não consegui agora (" + (m || "erro") + "). tenta de novo";
}

async function callClaude(prompt) {
  return JSON.parse(await pedir(prompt));
}

async function run() {
  const text = input.value.trim();
  if (!text) return;
  $("err").classList.add("hidden");
  $("res").classList.add("hidden");
  $("loading").classList.remove("hidden");
  go.disabled = true;
  try {
    const useWord = effMode() === "palavra";
    const data = await callClaude(useWord ? wordPrompt(text, state.target) : phrasePrompt(text, state.target));
    if (!useWord) {
      data.traducao = limpar(data.traducao);
      if (data.alternativa) data.alternativa = limpar(data.alternativa);
    } else if (Array.isArray(data.sentidos)) {
      data.sentidos = data.sentidos.map(s => ({...s, traducao: limpar(s.traducao)}));
    }
    state.result = { type: useWord ? "palavra" : "frase", data, original: text };
    state.showFormal = false;
    state.hist = [state.result, ...state.hist].slice(0, 30);
    localStorage.setItem("cru_hist", JSON.stringify(state.hist));
    render();

      ? "Muita tradução de uma vez. Espera um minutinho e manda de novo."

}

// Cinto de seguranca: mesmo mandado, as vezes escapa um travessao ou um ponto
// no tom solto. Aqui nao escapa.
function arrumaTexto(t, tom) {
  let s = String(t || "").replace(/\r/g, "");
  s = s.replace(/\s*[—–]\s*/g, ", ");
  s = s.replace(/(\S)\s+-\s+(\S)/g, "$1, $2");
  s = s.replace(/[“”«»]/g, "");
  s = s.replace(/[‘’]/g, "'");
  s = s.replace(/\*+/g, "");
  s = s.replace(/^\s*[•·]\s*/gm, "");
  if (tom === "solto") {
    s = s.replace(/(\d):(\d)/g, "$1\u0000$2");
    s = s.replace(/\s*:\s*/g, ", ");
    s = s.replace(/\u0000/g, ":");
    s = s.replace(/;/g, ",");
    s = s.replace(/\.{1,3}(?=\s|$)/g, "");
  }
  s = s.replace(/,\s*,/g, ",");
  s = s.replace(/[ \t]{2,}/g, " ");
  s = s.replace(/[ \t]+\n/g, "\n");
  s = s.replace(/\n{3,}/g, "\n\n");
  return s.trim();
}

// Se a resposta vier cortada ou fora do JSON, aproveita o que der em vez de
// jogar fora e mandar ele falar tudo de novo.
function soOTexto(cru) {
  try { const o = JSON.parse(cru); if (o && o.texto) return o.texto; } catch {}
  const m = String(cru).match(/"texto"\s*:\s*"([\s\S]*?)"?\s*\}?\s*$/);
  if (m) return m[1].replace(/\\n/g, "\n").replace(/\\"/g, '"').replace(/\\\\/g, "\\");
  return String(cru).trim();
}

function avisarSeCortou() {
  if (!respostaCortada) return;
  respostaCortada = false;
  const el = $("err2");
  el.classList.remove("hidden");
  el.textContent = "a fala era tão comprida que a resposta veio cortada. o que apareceu está certo, mas faltou o fim: manda a última parte separada";
}

async function organizar(depoisEnxuga) {
  const bruto = fala.value.trim();
  if (!bruto) return;
  if (bruto.length > 15000) return erroEsc("falou demais de uma vez. corta em duas partes e manda de novo");
  $("err2").classList.add("hidden");
  $("res2").innerHTML = "";
  $("loading2").classList.remove("hidden");
  org.disabled = true;
  try {
    const cru = await pedir(textoPrompt(bruto, redator.tom));
    const texto = arrumaTexto(soOTexto(cru), redator.tom);
    const pedacos = texto.split(/\n{2,}/).map(x => x.trim()).filter(Boolean);
    if (!pedacos.length) throw new Error("VAZIO");
    redator.bruto = bruto;
    redator.paras = pedacos;
    redator.trads = {};
    redator.marcados.clear();
    redator.editando = null;
    redator.completo = null;
    redator.conferencia = null;
    guardar(bruto);
    $("loading2").classList.add("hidden");
    avisarSeCortou();
    renderRed();
    if (depoisEnxuga) enxugar();
  } catch (e) {
    erroEsc(motivo(e));
  } finally { org.disabled = !fala.value.trim(); }
}
// sem a seta aqui o proprio evento do clique entrava como "depoisEnxuga" e o
// ORGANIZAR saia enxugando em seguida, sem ninguem pedir
org.onclick = () => organizar();

function renderRed() {
  const res = $("res2");
  if (!redator.paras.length) { res.innerHTML = ""; return; }
  const bandeira = (LANGS.find(x => x[0] === state.target) || [,,"🌐"])[2];
  const marcados = () => redator.paras.map((t, i) => i).filter(i => redator.marcados.has(i));
  const letras = (a) => a.join(" ").length;
  res.innerHTML = `
    ${redator.completo ? `<div class="enxuto">versão enxuta · ${redator.paras.length} parágrafo${redator.paras.length > 1 ? "s" : ""} no lugar de ${redator.completo.length}, ${Math.max(1, Math.round(100 - letras(redator.paras) / letras(redator.completo) * 100))}% menor
      <div class="conferido ${redator.conferencia && (redator.conferencia.faltou.length || redator.conferencia.perguntasSumidas) ? "ruim" : ""}">${
        redator.conferencia && (redator.conferencia.faltou.length || redator.conferencia.perguntasSumidas)
          ? "⚠️ ficou de fora: " + esc(redator.conferencia.faltou.slice(0, 8).join(", ")) + (redator.conferencia.perguntasSumidas ? " · e " + redator.conferencia.perguntasSumidas + " pergunta(s)" : "") + " · confere no completo"
          : "✓ conferido: nenhum número, nome ou pergunta ficou de fora"
      }</div></div>` : ""}
    <div class="texto-card">
      ${redator.paras.map((t, i) => {
        const tr = redator.trads[i];
        const on = redator.marcados.has(i);
        if (redator.editando === i) return `
        <div class="bloco"><textarea class="edita" id="ed${i}">${esc(t)}</textarea></div>
        <div class="para-acoes">
          <button class="mini salvap" data-i="${i}">salvar</button>
          <button class="mini cancelap">cancelar</button>
        </div>`;
        return `
        <div class="bloco ${on ? "marcado" : ""}">
          <button class="caixa ${on ? "on" : ""}" data-i="${i}">✓</button>
          <div class="para" data-i="${i}">${esc(t)}</div>
        </div>
        <div class="para-acoes">
          <button class="mini cpp" data-i="${i}">copiar</button>
          <button class="mini edp" data-i="${i}">editar</button>
          <button class="mini red trp" data-i="${i}">${bandeira} traduzir</button>
        </div>
        ${tr ? `<div class="para-tr">
            <div class="l">${esc(tr.lang)}</div>
            <div class="t">${esc(tr.texto)}</div>
            <button class="mini cptr" data-i="${i}" style="border-color:#fffbeb;color:#fffbeb;margin-top:10px;">copiar tradução</button>
          </div>` : ""}`;
      }).join("")}
    </div>
    <div class="acoes">
      <button class="copybtn dark" id="cpall">Copiar tudo</button>
      ${marcados().length ? `<button class="copybtn red" id="cpmarc">Copiar ${marcados().length} marcado${marcados().length > 1 ? "s" : ""}</button>
        <button class="linkbtn" id="desmarca">desmarcar</button>` : ""}
      <button class="linkbtn" id="refaz">refazer</button>
    </div>
    <div class="hint">${marcados().length
      ? "→ vão colados num texto só, com linha em branco entre eles"
      : "→ toca no parágrafo pra marcar e juntar vários num texto só"}</div>`;

  // Tocar no texto MARCA (é o gesto grande e fácil). Copiar um sozinho continua
  // no botao de copiar, que nao marca nada.
  res.querySelectorAll(".para, .caixa").forEach(el => el.onclick = (e) => {
    e.stopPropagation();
    const i = +el.dataset.i;
    if (redator.marcados.has(i)) redator.marcados.delete(i); else redator.marcados.add(i);
    renderRed();
  });
  res.querySelectorAll(".cpp").forEach(b => b.onclick = (e) => {
    e.stopPropagation(); copiar(redator.paras[+b.dataset.i]); toast("copiado ✓");
  });
  res.querySelectorAll(".cptr").forEach(b => b.onclick = (e) => {
    e.stopPropagation(); copiar(redator.trads[+b.dataset.i].texto); toast("copiado ✓");
  });
  res.querySelectorAll(".trp").forEach(b => b.onclick = (e) => { e.stopPropagation(); traduzirPara(+b.dataset.i, b); });

  // Editar um paragrafo na mao: salvar com o campo vazio APAGA o paragrafo, que
  // e o jeito mais curto de tirar do texto um pedaco que nao serve.
  res.querySelectorAll(".edp").forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    redator.editando = +b.dataset.i;
    renderRed();
    const ta = $("ed" + b.dataset.i);
    if (ta) { ta.focus(); ta.style.height = (ta.scrollHeight + 4) + "px"; ta.setSelectionRange(ta.value.length, ta.value.length); }
  });
  res.querySelectorAll(".salvap").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    const novo = ($("ed" + i) ? $("ed" + i).value : "").trim();
    redator.editando = null;
    if (!novo) {
      redator.paras.splice(i, 1);
      redator.marcados.clear();
      redator.trads = {};
      guardar();
      renderRed();
      return toast("parágrafo apagado ✓");
    }
    redator.paras[i] = novo;
    delete redator.trads[i];          // traducao velha nao vale mais pro texto novo
    guardar();
    renderRed();
    toast("parágrafo salvo ✓");
  });
  res.querySelectorAll(".cancelap").forEach(b => b.onclick = () => { redator.editando = null; renderRed(); });

  // Linha em branco entre um paragrafo e outro: e isso que faz o texto chegar
  // arejado do outro lado, em vez de virar um bloco so no zap.
  const juntar = (is) => is.map(i => redator.paras[i]).join("\n\n");
  $("cpall").onclick = () => { copiar(juntar(redator.paras.map((t, i) => i))); toast("texto todo copiado ✓"); };
  const cm = $("cpmarc");
  if (cm) cm.onclick = () => {
    const is = marcados();
    copiar(juntar(is));
    toast(is.length + (is.length > 1 ? " parágrafos copiados ✓" : " parágrafo copiado ✓"));
  };
  const dm = $("desmarca");
  if (dm) dm.onclick = () => { redator.marcados.clear(); renderRed(); };
  $("refaz").onclick = () => organizar(!!redator.completo);
  pintarEnxuga();
  renderHistRed();
}

async function enxugar() {
  if (!redator.paras.length) return;
  const inteiro = redator.paras.join("\n\n");
  $("err2").classList.add("hidden");
  $("loading2").classList.remove("hidden");
  $("loading2").innerHTML = '<span class="pulse"></span> lendo tudo de novo e tirando o que se repete...';
  const quantos = redator.paras.length;
  const alvo = Math.max(1, Math.ceil(quantos / 2));
  try {
    let novos = await pedirEnxuto(inteiro, alvo, quantos);
    // Segunda passada: se voltou do mesmo tamanho, a primeira nao fez o servico.
    // Aqui a meta aperta e o texto de entrada e o que ja voltou.
    const encolheu = 1 - novos.join(" ").length / inteiro.length;
    if (novos.length >= quantos || encolheu < 0.2) {
      const dedeNovo = await pedirEnxuto(novos.join("\n\n"), Math.max(1, Math.min(alvo, novos.length - 1)), novos.length);
      if (dedeNovo.length && dedeNovo.join(" ").length < novos.join(" ").length) novos = dedeNovo;
    }
    if (!novos.length) throw new Error("VAZIO");

    // conferencia: o que sumiu volta, e o que insistir em faltar vai escrito na tela
    let perdas = oQueSumiu(inteiro, novos.join("\n\n"));
    if (perdas.faltou.length || perdas.perguntasSumidas) {
      $("loading2").innerHTML = '<span class="pulse"></span> conferindo se não ficou nada importante de fora...';
      try {
        const cru2 = await pedir(repararPrompt(novos.join("\n\n"), perdas.faltou, perdas.perguntasSumidas));
        const consertado = arrumaTexto(soOTexto(cru2), redator.tom).split(/\n{2,}/).map(x => x.trim()).filter(Boolean);
        if (consertado.length) {
          const agora = oQueSumiu(inteiro, consertado.join("\n\n"));
          if (agora.faltou.length + agora.perguntasSumidas <= perdas.faltou.length + perdas.perguntasSumidas) {
            novos = consertado;
            perdas = agora;
          }
        }
      } catch {}
    }
    redator.conferencia = perdas;
    redator.completo = redator.paras;     // guarda o de antes pra ele poder voltar
    redator.paras = novos;
    redator.trads = {};
    redator.marcados.clear();
    $("loading2").classList.add("hidden");
    avisarSeCortou();
    guardar();
    renderRed();
    window.scrollTo({ top: document.body.scrollHeight / 3, behavior: "smooth" });
  } catch (e) {
    erroEsc(motivo(e));
  }
}

// Rodrigo 25/09/2026: "tem que ser reducao inteligente, porque eu ja tive
// conversas com inteligencia artificial onde resumiam e ao mesmo tempo perdiam
// contextos importantes". Entao o app CONFERE, nao confia: antes e depois de
// encurtar ele tira do texto os itens que nao podem sumir (numero, valor, data,
// nome proprio, pergunta) e compara um por um. O que faltar, ele manda buscar de
// volta, e o que ainda faltar aparece escrito na tela.
const PALAVRAS_COMUNS = new Set(("A O E Os As Um Uma Eu Ele Ela Nos Nós Se Mas Entao Então Porque Quando Como Isso Isto " +
  "Essa Esse Sobre Depois Outra Outro Tambem Também Preciso Ja Já Nao Não Ai Aí Aqui Qualquer Bom Boa Cara Tem Vai So Só " +
  "Da De Do Na No Em Pra Para Por Que Com Sem Ate Até Tudo Todo Toda Agora Hoje Ontem Amanha Amanhã Eles Voce Você " +
  "Ah Oi Ola Olá Entrei Falei Mandei Fiquei Vou Ter Foi Era Tinha Sim Resumindo").split(/\s+/));

function itensDuros(t) {
  const texto = String(t || "");
  const numeros = (texto.match(/\d+(?:[.,:\/-]\d+)*/g) || []).filter(n => n.length >= 2);
  const nomes = [];
  texto.split(/[.!?\n]+/).forEach(frase => {
    frase.trim().split(/\s+/).slice(1).forEach(p => {   // pula a 1a palavra: maiuscula de comeco de frase nao vale
      const limpo = p.replace(/^[^A-Za-zÀ-ÿ]+|[^A-Za-zÀ-ÿ]+$/g, "");
      if (limpo.length >= 3 && /^[A-ZÀ-Ý]/.test(limpo) && !PALAVRAS_COMUNS.has(limpo)) nomes.push(limpo);
    });
  });
  return {
    numeros: [...new Set(numeros)],
    nomes: [...new Set(nomes)],
    perguntas: (texto.match(/\?/g) || []).length
  };
}

function oQueSumiu(antes, depois) {
  const a = itensDuros(antes), d = itensDuros(depois);
  const baixo = depois.toLowerCase();
  const faltou = [];
  a.numeros.forEach(n => { if (!depois.includes(n)) faltou.push(n); });
  a.nomes.forEach(n => { if (!baixo.includes(n.toLowerCase())) faltou.push(n); });
  return { faltou, perguntasSumidas: Math.max(0, a.perguntas - d.perguntas) };
}

function repararPrompt(enxuto, faltando, perguntasSumidas) {
  return `Este é um texto curto que saiu do resumo de uma fala. No caminho ele perdeu informação que não podia perder.

FALTOU: ${faltando.join(", ")}${perguntasSumidas ? `. Além disso sumiram ${perguntasSumidas} pergunta(s) que a pessoa fez, e toda pergunta tem que continuar no texto` : ""}.

SUA TAREFA: devolver o mesmo texto com essas informações de volta, encaixadas onde fazem sentido. Não reescreva o que já está certo, não aumente o texto além do necessário pra caber o que faltou, e não invente nada em volta.

PROIBIDO: travessão e hífen de pontuação, emoji, bullet, título e asterisco.

TEXTO:
"""${enxuto}"""

Responda SOMENTE com JSON válido, sem markdown:
{"texto":"o texto com o que faltava de volta, parágrafos separados por \\n\\n"}`;
}

// Uma volta do enxugar: pede, arruma e devolve os paragrafos.
async function pedirEnxuto(texto, alvo, quantos) {
  const cru = await pedir(enxugarPrompt(texto, redator.tom, alvo, quantos));
  return arrumaTexto(soOTexto(cru), redator.tom).split(/\n{2,}/).map(x => x.trim()).filter(Boolean);
}

function voltarCompleto() {
  if (!redator.completo) return;
  redator.paras = redator.completo;
  redator.completo = null;
  redator.conferencia = null;
  redator.trads = {};
  redator.marcados.clear();
  guardar();
  renderRed();
}

// Traduz UM paragrafo pelo idioma que estiver escolhido la em cima, usando o
// mesmo tradutor da outra tela. No tom formal ele pega a versao formal.
async function traduzirPara(i, btn) {
  const texto = redator.paras[i];
  const alvo = state.target;
  const antes = btn.textContent;
  btn.textContent = "traduzindo...";
  btn.disabled = true;
  try {
    const d = await callClaude(phrasePrompt(texto, alvo));
    const escolhida = redator.tom === "formal" && d.formal ? d.formal : d.traducao;
    redator.trads[i] = { texto: limpar(escolhida), lang: `pt → ${langName(alvo)}` };
    renderRed();
  } catch (e) {
    btn.textContent = antes;
    btn.disabled = false;
    toast(motivo(e));
  }
}

// Guarda a fala e o texto arrumado dela. Chamado depois de organizar, de enxugar
// e de qualquer edicao na mao, senao o que volta nao e o que ele deixou na tela.
function guardar(bruto) {
  const b = bruto || redator.bruto;
  if (!b) return;
  const item = { bruto: b, tom: redator.tom, paras: redator.paras, completo: redator.completo, quando: Date.now() };
  redator.hist = [item, ...redator.hist.filter(h => h.bruto !== b)].slice(0, 15);
  try { localStorage.setItem("cru_red_hist", JSON.stringify(redator.hist)); } catch {}
}

function renderHistRed() {
  const h = redator.hist;
  if (!h.length) return;
  $("hist2").classList.remove("hidden");
  $("histlist2").innerHTML = h.slice(0, 12).map((x, i) =>
    `<button class="hist-item" data-i="${i}">${x.paras && x.paras.length ? "📄 " : ""}${esc(x.bruto)}</button>`).join("");
  // Tocar num texto de antes traz ele PRONTO de volta, sem pedir nada de novo pro
  // servidor: o arrumado ja estava guardado aqui.
  $("histlist2").querySelectorAll(".hist-item").forEach(b => b.onclick = () => {
    const x = redator.hist[+b.dataset.i];
    if (!x) return;
    fala.value = x.bruto;
    fala.dispatchEvent(new Event("input"));
    redator.bruto = x.bruto;
    redator.paras = x.paras || [];
    redator.completo = x.completo || null;
    redator.trads = {};
    redator.marcados.clear();
    redator.editando = null;
    renderRed();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
}

async function copiar(t) { try { await navigator.clipboard.writeText(t); } catch {} }

function abrirTela(qual) {
  const escrever = qual === "escrever";
  $("view-traduzir").classList.toggle("hidden", escrever);
  $("view-escrever").classList.toggle("hidden", !escrever);
  $("troca").textContent = escrever ? "🌐 traduzir" : "✍️ escrever";
  $("sub").textContent = escrever ? "você fala, ele arruma" : "tradutor sem filtro";
  $("rodape").textContent = escrever
    ? "você fala do teu jeito. ele só organiza."
    : "cultura não se traduz. intenção atravessa.";
  if (TEM_VOZ) speechSynthesis.cancel();
  if (escrever) return;
  localStorage.setItem("cru_tela", qual);
  window.scrollTo({ top: 0 });
}
$("troca").onclick = () => abrirTela($("view-escrever").classList.contains("hidden") ? "escrever" : "traduzir");

// Volta o que ficou na tela da ultima vez: o rascunho do campo e, se houver, o
// texto ja arrumado. Nada disso custa chamada nenhuma, ta tudo no aparelho.
(function retomar() {
  let rascunho = "";
  try { rascunho = localStorage.getItem("cru_red_rascunho") || ""; } catch {}
  const ultimo = redator.hist[0];
  if (ultimo && ultimo.paras && ultimo.paras.length) {
    redator.bruto = ultimo.bruto;
    redator.paras = ultimo.paras;
    redator.completo = ultimo.completo || null;

// ── versao nova chega sozinha ─────────────────────────────────────────────
// Rodrigo 25/09/2026 mandou a tela de um conserto que ja estava no ar ha uma
// hora: no iPhone o app instalado fica vivo em memoria por dias e nao recarrega
// sozinho nem com a publicacao feita. Agora ele pergunta a versao toda vez que
// volta pra frente e se atualiza. Se tiver texto na tela, ele nao toma a decisao
// pelo Rodrigo: mostra o botao e espera o toque.
const VERSAO = "17";

// Texto guardado volta sozinho depois do reload, entao nao e motivo pra segurar
// a atualizacao. Só segura o que se perderia: uma edicao aberta ou algo digitado
// na tela de traduzir, que nao tem gaveta.
function trabalhoEmAndamento() {
  return !!(input.value.trim() || redator.editando !== null);
}

function mostrarBotaoAtualizar() {
  if ($("avisonovo")) return;
  const b = document.createElement("button");
  b.className = "aviso-novo";
  b.id = "avisonovo";
  b.textContent = "⬆️ versão nova do CRU · toca pra atualizar";
  b.onclick = () => location.reload();
  document.body.appendChild(b);
}

async function conferirVersao() {
  try {
    const r = await fetch("/versao.json?x=" + Date.now(), { cache: "no-store" });
    const v = String((await r.json()).v || "");
    if (!v || v === VERSAO) return;
    if (sessionStorage.getItem("cru_recarregou") === v) return;   // ja tentei, nao fico em laco
    sessionStorage.setItem("cru_recarregou", v);
    if (trabalhoEmAndamento()) return mostrarBotaoAtualizar();
    location.reload();
  } catch {}
}

document.addEventListener("visibilitychange", () => { if (!document.hidden) conferirVersao(); });
window.addEventListener("focus", conferirVersao);
conferirVersao();
