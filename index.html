<body>
<header>
  <div>
    <h1>CRU<span class="dot">.</span></h1>
    <div class="sub" id="sub">tradutor sem filtro</div>
  </div>
  <div style="display:flex;align-items:center;gap:6px;">
    <select id="lang"></select>
    <button class="troca" id="troca">✍️ escrever</button>

</header>

<main>
<section id="view-traduzir">
  <div class="box">
    <textarea id="input" rows="3" placeholder="Escreve do teu jeito. Palavrão, gíria, ironia, tudo passa."></textarea>
    <div class="bar">
      <div class="modes" id="modes">

    </div>

</section>

<section id="view-escrever" class="hidden">
  <div class="box">
    <textarea id="fala" rows="4" placeholder="Aperta FALAR e fala à vontade. O texto vem escrito depois, de uma vez. Ou escreve aqui mesmo."></textarea>
    <div class="bar">
      <button class="mic hidden" id="mic">🎙 Falar</button>
      <div style="display:flex;align-items:center;gap:8px;">

  </div>
  <div class="hint" id="dicatom"></div>
  <div class="err hidden" id="err2"></div>
  <div class="loading hidden" id="loading2"><span class="pulse"></span> arrumando o que você falou...</div>
  <div id="res2"></div>
  <div class="hist hidden" id="hist2">
    <div class="sub-label grey" style="margin-bottom:6px;">falas anteriores</div>
    <div id="histlist2"></div>
  </div>
</section>
</main>

<footer id="rodape">cultura não se traduz. intenção atravessa.</footer>


<script>
const LANGS = [
  ["es","Español","🇵🇦"],["en","English","🇺🇸"],["ru","Русский","🇷🇺"],
  ["fr","Français","🇫🇷"],["it","Italiano","🇮🇹"],["de","Deutsch","🇩🇪"],
  ["zh","中文","🇨🇳"],["ja","日本語","🇯🇵"],["ko","한국어","🇰🇷"],
  ["ar","العربية","🇸🇦"],["tr","Türkçe","🇹🇷"],["th","ไทย","🇹🇭"],
  ["vi","Tiếng Việt","🇻🇳"],["id","Indonesia","🇮🇩"],["nl","Nederlands","🇳🇱"],
  ["el","Ελληνικά","🇬🇷"],["hi","हिन्दी","🇮🇳"],["pl","Polski","🇵🇱"]
];
const $ = (id) => document.getElementById(id);

// ── VOZ ────────────────────────────────────────────────────────────────────
// Rodrigo 07/09/2026: "coloca pra escutar como que pronuncia".
// Usa a voz do proprio aparelho (speechSynthesis): sai na hora, funciona sem
// internet e nao custa nada por traducao. No iPhone so toca a partir de um
// toque na tela, e por isso e sempre botao, nunca automatico.
const TAG = {
  es:"es-MX", en:"en-US", ru:"ru-RU", fr:"fr-FR", it:"it-IT", de:"de-DE",
  zh:"zh-CN", ja:"ja-JP", ko:"ko-KR", ar:"ar-SA", tr:"tr-TR", th:"th-TH",
  vi:"vi-VN", id:"id-ID", nl:"nl-NL", el:"el-GR", hi:"hi-IN", pl:"pl-PL"
};
const TEM_VOZ = typeof speechSynthesis !== "undefined" && typeof SpeechSynthesisUtterance !== "undefined";

// A traducao esta na lingua de destino, MENOS quando a direcao termina em "pt"
// (o usuario mandou em outra lingua e recebeu portugues de volta).
function tagDaTraducao(direcao) {
  const d = String(direcao || "");
  if (/→\s*pt$/.test(d)) return "pt-BR";
  const m = d.match(/→\s*([a-z]{2})/);
  return TAG[m && m[1]] || TAG[state.target] || "pt-BR";
}

let _falandoEm = null;
function falar(texto, tag, botao) {
  if (!TEM_VOZ || !texto) return;
  const mesmo = _falandoEm === botao && speechSynthesis.speaking;
  speechSynthesis.cancel();                 // sem isso a fila empilha no iOS
  document.querySelectorAll(".spk.on,.soundbtn.on").forEach(b => b.classList.remove("on"));
  if (mesmo) { _falandoEm = null; return; } // segundo toque = parar
  const u = new SpeechSynthesisUtterance(String(texto));
  u.lang = tag;
  u.rate = 0.92;                            // um tico mais devagar: e pra APRENDER a falar
  const v = speechSynthesis.getVoices().find(x => x.lang === tag)
        || speechSynthesis.getVoices().find(x => x.lang.slice(0,2) === tag.slice(0,2));
  if (v) u.voice = v;
  if (botao) {
    botao.classList.add("on");
    _falandoEm = botao;
    u.onend = u.onerror = () => { botao.classList.remove("on"); _falandoEm = null; };
  }
  speechSynthesis.speak(u);
}
// O iPhone entrega a lista de vozes atrasada; sem isto a primeira fala sai na
// voz errada porque getVoices() ainda estava vazio.
if (TEM_VOZ) speechSynthesis.onvoiceschanged = () => {};
try { localStorage.removeItem("cru_key"); } catch {}
const state = {
  mode: "auto",
  target: localStorage.getItem("cru_lang") || "es",
  hist: JSON.parse(localStorage.getItem("cru_hist") || "[]"),
  result: null, showFormal: false
};

// idiomas
const sel = $("lang");
LANGS.forEach(([c,l,f]) => {
  const o = document.createElement("option");
  o.value = c; o.textContent = `${f} PT ↔ ${l}`;
  sel.appendChild(o);
});
sel.value = state.target;
sel.onchange = () => { state.target = sel.value; localStorage.setItem("cru_lang", sel.value); };

const langName = (c) => (LANGS.find(x => x[0]===c)||[,"?"])[1];

const isWord = (t) => {
  const c = t.trim();
  return c && c.split(/\s+/).length <= 2 && !/[.!?,;:]/.test(c);
};

const limpar = (t) => {
  if (!t || typeof t !== "string") return t;
  let s = t;
  s = s.replace(/[¿¡]/g, "");
  s = s.replace(/\s*[—–]\s*/g, ", ");
  s = s.replace(/\s+-\s+/g, ", ");
  s = s.replace(/_/g, " ");
  s = s.replace(/(\d):(\d)/g, "$1\u0000$2");
  s = s.replace(/\s*:\s*/g, ", ");
  s = s.replace(/\u0000/g, ":");
  s = s.replace(/;/g, ",");
  s = s.replace(/["\u201C\u201D«»]/g, "");
  s = s.replace(/\s{2,}/g, " ").trim();
  s = s.replace(/\.+$/, "");
  s = s.replace(/,\s*,/g, ",");
  return s.trim();
};

function phrasePrompt(input, target) {
  const ln = langName(target);
  return `Você é um tradutor CULTURAL CRU entre português brasileiro e ${ln}.

REGRA CENTRAL: você NUNCA higieniza, suaviza, formaliza ou "adapta culturalmente" o conteúdo. Você traduz a MENSAGEM COM A MESMA ENERGIA. Se o texto é agressivo, a tradução é agressiva no mesmo grau. Se é carinhoso e meloso, sai meloso. Se tem palavrão, sai com palavrão de peso equivalente. Se é irônico, sai irônico. A intenção, a intensidade e o registro atravessam intactos. O ouvinte deve sentir EXATAMENTE o que um brasileiro sentiria ouvindo o original.

O que você adapta é só o veículo linguístico: use a gíria, o palavrão e a construção NATIVA que carrega o mesmo peso e o mesmo tom na língua de destino (para espanhol, priorize o uso latino-americano quando houver diferença). Não traduza literalmente expressões idiomáticas: encontre a equivalente com a mesma força. Nunca troque um insulto por eufemismo, nunca transforme intimidade em formalidade, nunca adicione cortesia que não existia.

DIREÇÃO: detecte o idioma do texto. Se for português, traduza para ${ln}. Se for ${ln} ou outro idioma, traduza para português brasileiro coloquial, mantendo o tom cru original do falante.

FORMATAÇÃO OBRIGATÓRIA DA TRADUÇÃO INFORMAL: sai pronta pra colar no WhatsApp, escrita como nativo escreve no celular de verdade. PROIBIDO TERMINANTEMENTE: travessão e hífen de pontuação, dois pontos, ponto e vírgula, underline, aspas, parênteses, interrogação e exclamação invertidas do espanhol (nativo nenhum usa isso no zap), e ponto final no fim da mensagem. Pontuação permitida: vírgula, e no máximo ? ou ! de fechamento quando a frase realmente pedir. Abreviações naturais da língua são bem-vindas quando o original for informal. A versão "formal" pode usar pontuação completa, a regra dura vale só pra informal.

TEXTO:
"""${input}"""

Responda SOMENTE com JSON válido, sem markdown, sem texto antes ou depois:
{"direcao":"pt→${target}" ou "${target}→pt","traducao":"a tradução crua e informal estilo WhatsApp","formal":"a mesma mensagem em registro formal e educado","tom":"1 frase curta em português dizendo como isso chega no ouvinte","fala":"pronúncia romanizada simples pra brasileiro se o destino usar alfabeto não latino, senão null","alternativa":"segunda forma nativa igualmente fiel se existir, senão null"}`;
}

function wordPrompt(input, target) {
  const ln = langName(target);
  return `Você é um dicionário de contextos entre português brasileiro e ${ln}.

O usuário mandou uma palavra ou expressão curta. NÃO assuma o sentido mais usual. Liste TODOS os sentidos relevantes (até 6), do mais comum ao menos comum, cada um com tradução própria e exemplo real coloquial. Inclua gíria e uso vulgar quando existirem, sem censura.

DIREÇÃO: detecte o idioma da palavra. Se for português, sentidos traduzidos para ${ln}. Se for ${ln}, traduzidos para português brasileiro.

PALAVRA: """${input}"""

Responda SOMENTE com JSON válido, sem markdown:
{"palavra":"a palavra","direcao":"pt→${target}" ou "${target}→pt","sentidos":[{"contexto":"rótulo curto em português","traducao":"equivalente nesse contexto","fala":"pronúncia romanizada se alfabeto não latino, senão null","exemplo":"frase exemplo no idioma de destino","exemplo_origem":"a mesma frase no idioma de origem"}]}`;
}

// pede e nao sabe de chave: so manda o texto e recebe a traducao.
const CANO = "https://www.otimizi.com/api/cru/traduzir";

async function pedir(prompt) {
  const res = await fetch(CANO, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ prompt })
  });
  if (res.status === 429) throw new Error("MUITO");
  if (!res.ok) throw new Error("API " + res.status);
  const data = await res.json();
  if (data.erro) throw new Error(data.erro);
  return String(data.texto || "").replace(/```json|```/g, "").trim();
}

async function callClaude(prompt) {
  return JSON.parse(await pedir(prompt));
}

function textoPrompt(bruto, tom) {
  return `Você organiza em português brasileiro um texto que a pessoa acabou de FALAR no microfone. Ele chega cru: sem pontuação, com repetição, com "é", "tipo", "assim", e com erro de reconhecimento de voz.

SUA TAREFA: devolver o MESMO recado, arrumado e pronto pra colar. Você NÃO inventa informação, NÃO acrescenta saudação, despedida, oferta ou dado que ele não falou, e NÃO resume a ponto de perder conteúdo. Conserte pelo contexto o que o reconhecimento de voz entendeu errado. Tire os vícios de fala e a repetição. Mantenha a voz dele: é uma pessoa falando, não um robô.

PARÁGRAFOS: quebre em parágrafos separados por uma linha em branco, de tamanhos diferentes e naturais. Um parágrafo pode ter uma frase só quando o assunto é curto, outro pode ter três ou quatro. Assunto novo começa parágrafo novo. Nunca devolva um bloco único.

PROIBIDO EM QUALQUER TOM: travessão e hífen fazendo papel de pontuação. Onde ele apareceria, use vírgula, ponto ou frase nova. Proibido também emoji, bullet, título, asterisco, negrito, aspas decorativas, e frase de robô do tipo "espero que esteja bem" ou "fico à disposição para maiores esclarecimentos" se ele não falou nada parecido.

TOM: ${TOM_REGRA[tom] || TOM_REGRA.natural}

TEXTO FALADO:
"""${bruto}"""

Responda SOMENTE com JSON válido, sem markdown, sem texto antes ou depois:
{"texto":"o texto arrumado, com os parágrafos separados por \\n\\n"}`;
}

// Cinto de seguranca: mesmo mandado, as vezes escapa um travessao ou um ponto
// no tom solto. Aqui nao escapa.
function arrumaTexto(t, tom) {
  let s = String(t || "").replace(/\r/g, "");
  s = s.replace(/\s*[—–]\s*/g, ", ");
  s = s.replace(/(\S)\s+-\s+(\S)/g, "$1, $2");
  s = s.replace(/[“”«»]/g, "");
  s = s.replace(/[‘’]/g, "'");
  s = s.replace(/\*+/g, "");
  s = s.replace(/^\s*[•·]\s*/gm, "");
  if (tom === "solto") {
    s = s.replace(/(\d):(\d)/g, "$1\u0000$2");
    s = s.replace(/\s*:\s*/g, ", ");
    s = s.replace(/\u0000/g, ":");
    s = s.replace(/;/g, ",");
    s = s.replace(/\.{1,3}(?=\s|$)/g, "");
  }
  s = s.replace(/,\s*,/g, ",");
  s = s.replace(/[ \t]{2,}/g, " ");
  s = s.replace(/[ \t]+\n/g, "\n");
  s = s.replace(/\n{3,}/g, "\n\n");
  return s.trim();
}

// Se a resposta vier cortada ou fora do JSON, aproveita o que der em vez de
// jogar fora e mandar ele falar tudo de novo.
function soOTexto(cru) {
  try { const o = JSON.parse(cru); if (o && o.texto) return o.texto; } catch {}
  const m = String(cru).match(/"texto"\s*:\s*"([\s\S]*?)"?\s*\}?\s*$/);
  if (m) return m[1].replace(/\\n/g, "\n").replace(/\\"/g, '"').replace(/\\\\/g, "\\");
  return String(cru).trim();
}

// O iPhone corta o reconhecimento sozinho a cada poucos segundos: por isso ele
// religa no onend enquanto o botao estiver aceso.
// ── microfone: grava tudo e so entende no fim ─────────────────────────────
// Rodrigo 25/09/2026: "e bom se tivesse um microfone igual o do Gemini, ele nao
// tenta entender logo de primeira e nem mostra, vai escutando um monte de coisa
// e no final ele usa uma estrelinha pra entender todo o contexto".
//
// O reconhecimento do proprio navegador fazia o contrario: adivinhava palavra
// por palavra, mostrava errado na tela e no iPhone encerrava sozinho a cada
// poucos segundos (foi o que travou o app). Agora ele so GRAVA. A fala inteira

const OUVIDO = "https://www.otimizi.com/api/cru/ouvir";
const TEM_GRAVADOR = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
const APP_INSTALADO = window.navigator.standalone === true
  || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
const TETO_SEG = 300;   // 5 minutos, depois disso ele para sozinho

let gravador = null, microfone = null, pedacos = [], ouvindo = false;
let t0 = 0, tic = null, som = null, medidor = null, quadro = null, ultimoAudio = null;

mic.classList.remove("hidden");

function status(msg, ruim, titulo) {
  const el = $("micstatus");
  if (!msg) { el.classList.add("hidden"); return; }

}

// O microfone do teclado do proprio iPhone funciona sempre, mesmo quando o do
// navegador nao vai. Quando falha, e pra la que mando ele.
function usaOTeclado(porque) {
  pararMic();
  status("toca dentro da caixa de texto, aperta o 🎤 do teclado do teu iPhone, fala, e depois é só apertar ORGANIZAR aqui.", true, porque);
}

const mmss = (s) => String(Math.floor(s / 60)) + ":" + String(s % 60).padStart(2, "0");

function telaGravando() {
  const el = $("micstatus");
  el.classList.remove("hidden", "ruim");
  el.innerHTML = '<b>gravando · <span id="relogio">0:00</span></b>'
    + '<div class="barra"><i id="nivel"></i></div>'
    + "fala à vontade. o texto não aparece agora, ele vem escrito de uma vez quando você apertar PARAR";
}

async function ligarMic() {
  if (!TEM_GRAVADOR) return usaOTeclado("este navegador não grava áudio");
  try {
    microfone = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
  } catch (e) {
    return usaOTeclado(APP_INSTALADO
      ? "o app instalado não liberou o microfone. abre pelo Safari, ou:"
      : "o aparelho não liberou o microfone pro navegador");
  }
  const tipo = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm", "audio/ogg"]
    .find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
  try {
    gravador = new MediaRecorder(microfone, tipo ? { mimeType: tipo, audioBitsPerSecond: 32000 } : undefined);
  } catch { return usaOTeclado("o gravador não abriu neste navegador"); }

  pedacos = [];
  gravador.ondataavailable = (e) => { if (e.data && e.data.size) pedacos.push(e.data); };
  gravador.onstop = mandarPraOuvir;
  gravador.start(1000);            // junta o audio de segundo em segundo

  ouvindo = true;
  t0 = Date.now();
  mic.classList.add("on");
  mic.textContent = "⏹ Parar";
  telaGravando();
  tic = setInterval(() => {
    const seg = Math.floor((Date.now() - t0) / 1000);
    const r = $("relogio");
    if (r) r.textContent = mmss(seg);
    if (seg >= TETO_SEG) { pararMic(); }
  }, 500);
  medirSom();
}

// A barrinha mexendo e o unico retorno enquanto ele fala: e o que mostra que o
// aparelho esta mesmo escutando, sem chutar palavra na tela.
function medirSom() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    som = new AC();
    const fonte = som.createMediaStreamSource(microfone);
    medidor = som.createAnalyser();
    medidor.fftSize = 256;
    fonte.connect(medidor);
    const dados = new Uint8Array(medidor.frequencyBinCount);
    const passo = () => {
      if (!ouvindo) return;
      medidor.getByteFrequencyData(dados);
      let soma = 0;
      for (let i = 0; i < dados.length; i++) soma += dados[i];
      const n = Math.min(100, Math.round((soma / dados.length) * 2.2) + 2);
      const b = $("nivel");
      if (b) b.style.width = n + "%";
      quadro = requestAnimationFrame(passo);
    };
    passo();
  } catch {}
}

function pararMic() {
  const estava = ouvindo;
  ouvindo = false;
  clearInterval(tic);
  if (quadro) cancelAnimationFrame(quadro);
  mic.classList.remove("on");
  mic.textContent = "🎙 Falar";
  try { if (gravador && gravador.state !== "inactive") gravador.stop(); } catch {}
  try { if (som) som.close(); } catch {}
  som = null;
  return estava;
}

function soltarMicrofone() {
  try { if (microfone) microfone.getTracks().forEach(t => t.stop()); } catch {}
  microfone = null;
}

async function mandarPraOuvir() {
  soltarMicrofone();
  const tipo = (gravador && gravador.mimeType) || "audio/mp4";
  const blob = new Blob(pedacos, { type: tipo });
  gravador = null;
  if (blob.size < 2000) return status("não veio som nenhum. confere se o microfone está liberado", true, "ficou mudo");
  ultimoAudio = blob;
  await transcrever(blob);
}

async function transcrever(blob) {
  status("entendendo tudo o que você falou...", false, "escutando a gravação inteira");
  const ext = /mp4|m4a/.test(blob.type) ? "m4a" : /ogg/.test(blob.type) ? "ogg" : "webm";
  try {
    const fd = new FormData();
    fd.append("audio", blob, "fala." + ext);
    const r = await fetch(OUVIDO, { method: "POST", body: fd });
    const data = await r.json().catch(() => ({}));
    if (!r.ok || data.erro) throw new Error(data.erro || ("erro " + r.status));
    const texto = String(data.texto || "").trim();
    if (!texto) throw new Error("não entendi nada do áudio");
    fala.value = (fala.value ? fala.value.trim() + " " : "") + texto;
    fala.dispatchEvent(new Event("input"));
    status(null);
    organizar();                   // ja entrega arrumado, sem ele apertar nada
  } catch (e) {
    status((e.message || "deu ruim") + ". o áudio não se perdeu, dá pra mandar de novo.", true, "não consegui transcrever");
    const el = $("micstatus");
    const b = document.createElement("button");
    b.className = "mini";
    b.style.marginTop = "8px";
    b.textContent = "mandar de novo";
    b.onclick = () => transcrever(ultimoAudio);
    el.appendChild(document.createElement("br"));
    el.appendChild(b);
  }
}

    const texto = arrumaTexto(soOTexto(cru), redator.tom);
    redator.bruto = bruto;
    redator.paras = texto.split(/\n{2,}/).map(x => x.trim()).filter(Boolean);
    redator.trads = {};
    redator.hist = [{ bruto, tom: redator.tom }, ...redator.hist.filter(h => h.bruto !== bruto)].slice(0, 15);
    localStorage.setItem("cru_red_hist", JSON.stringify(redator.hist));
    $("loading2").classList.add("hidden");
    renderRed();
  } catch (e) {
    erroEsc(e.message === "MUITO"
      ? "muita coisa de uma vez. espera um minutinho e manda de novo"
      : "deu ruim aqui. tenta de novo");
  } finally { org.disabled = !fala.value.trim(); }
}
org.onclick = organizar;

function renderRed() {
  const res = $("res2");
  if (!redator.paras.length) { res.innerHTML = ""; return; }
  const bandeira = (LANGS.find(x => x[0] === state.target) || [,,"🌐"])[2];
  res.innerHTML = `
    <div class="texto-card">
      ${redator.paras.map((t, i) => {
        const tr = redator.trads[i];
        return `
        <div class="para" data-i="${i}">${esc(t)}</div>
        <div class="para-acoes">
          <button class="mini cpp" data-i="${i}">copiar</button>
          <button class="mini red trp" data-i="${i}">${bandeira} traduzir</button>
        </div>
        ${tr ? `<div class="para-tr">
            <div class="l">${esc(tr.lang)}</div>
            <div class="t">${esc(tr.texto)}</div>
            <button class="mini cptr" data-i="${i}" style="border-color:#fffbeb;color:#fffbeb;margin-top:10px;">copiar tradução</button>
          </div>` : ""}`;
      }).join("")}
    </div>
    <div class="acoes">
      <button class="copybtn dark" id="cpall">Copiar tudo</button>
      <button class="linkbtn" id="refaz">refazer</button>
    </div>`;

  res.querySelectorAll(".para").forEach(el => el.onclick = () => {
    copiar(redator.paras[+el.dataset.i]); toast("parágrafo copiado ✓");
  });
  res.querySelectorAll(".cpp").forEach(b => b.onclick = (e) => {
    e.stopPropagation(); copiar(redator.paras[+b.dataset.i]); toast("copiado ✓");
  });
  res.querySelectorAll(".cptr").forEach(b => b.onclick = (e) => {
    e.stopPropagation(); copiar(redator.trads[+b.dataset.i].texto); toast("copiado ✓");
  });
  res.querySelectorAll(".trp").forEach(b => b.onclick = (e) => { e.stopPropagation(); traduzirPara(+b.dataset.i, b); });
  $("cpall").onclick = () => { copiar(redator.paras.join("\n\n")); toast("texto todo copiado ✓"); };
  $("refaz").onclick = () => organizar();
  renderHistRed();
}

// Traduz UM paragrafo pelo idioma que estiver escolhido la em cima, usando o
// mesmo tradutor da outra tela. No tom formal ele pega a versao formal.
async function traduzirPara(i, btn) {
  const texto = redator.paras[i];
  const alvo = state.target;
  const antes = btn.textContent;
  btn.textContent = "traduzindo...";
  btn.disabled = true;
  try {
    const d = await callClaude(phrasePrompt(texto, alvo));
    const escolhida = redator.tom === "formal" && d.formal ? d.formal : d.traducao;
    redator.trads[i] = { texto: limpar(escolhida), lang: `pt → ${langName(alvo)}` };
    renderRed();
  } catch (e) {
    btn.textContent = antes;
    btn.disabled = false;
    toast(e.message === "MUITO" ? "espera um minutinho" : "não deu pra traduzir");
  }
}

function renderHistRed() {
  const h = redator.hist;
  if (h.length <= 1) return;
  $("hist2").classList.remove("hidden");
  $("histlist2").innerHTML = h.slice(1, 10).map((x, i) =>
    `<button class="hist-item" data-i="${i + 1}">${esc(x.bruto)}</button>`).join("");
  $("histlist2").querySelectorAll(".hist-item").forEach(b => b.onclick = () => {
    fala.value = redator.hist[+b.dataset.i].bruto;
    fala.dispatchEvent(new Event("input"));
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
}

async function copiar(t) { try { await navigator.clipboard.writeText(t); } catch {} }

// ── trocar de funcao ───────────────────────────────────────────────────────
function abrirTela(qual) {
  const escrever = qual === "escrever";
  $("view-traduzir").classList.toggle("hidden", escrever);
  $("view-escrever").classList.toggle("hidden", !escrever);
  $("troca").textContent = escrever ? "🌐 traduzir" : "✍️ escrever";
  $("sub").textContent = escrever ? "você fala, ele arruma" : "tradutor sem filtro";
  $("rodape").textContent = escrever
    ? "você fala do teu jeito. ele só organiza."
    : "cultura não se traduz. intenção atravessa.";
  if (TEM_VOZ) speechSynthesis.cancel();
  if (escrever) return;
  if (ouvindo) { pararMic(); soltarMicrofone(); pedacos = []; }
  localStorage.setItem("cru_tela", qual);
  window.scrollTo({ top: 0 });
}
$("troca").onclick = () => abrirTela($("view-escrever").classList.contains("hidden") ? "escrever" : "traduzir");

// limpar da tela de traduzir
$("limpa").onclick = () => {
  input.value = "";
  input.dispatchEvent(new Event("input"));
  input.focus();
};
input.addEventListener("input", () => $("limpa").classList.toggle("hidden", !input.value.trim()));

// trocar de idioma la em cima invalida as traducoes ja mostradas aqui embaixo
sel.addEventListener("change", () => { redator.trads = {}; if (redator.paras.length) renderRed(); });

document.querySelectorAll("#tons button").forEach(b => b.classList.toggle("on", b.dataset.t === redator.tom));
dicaTom();
abrirTela(localStorage.getItem("cru_tela") || "traduzir");

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
